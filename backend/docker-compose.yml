services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "src/server.js"]

    dns:
      - ${DOCKER_DNS_PRIMARY:-1.1.1.1}
      - ${DOCKER_DNS_SECONDARY:-8.8.8.8}

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      HOST: ${HOST}
      PORT: ${PORT}
      FEEDBACK_RECIPIENT_EMAIL: ${FEEDBACK_RECIPIENT_EMAIL}

      USER_TIER: ${USER_TIER}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ReviewX}
      SMTP_REPLY_TO_EMAIL: ${SMTP_REPLY_TO_EMAIL:-}

      MONGODB_URI: ${MONGODB_URI}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE}
      MONGODB_AUTO_INDEX: ${MONGODB_AUTO_INDEX}

      REDIS_URL: redis://redis:6379
      REVIEW_SOURCE_REDIS_PREFIX: ${REVIEW_SOURCE_REDIS_PREFIX}
      REVIEW_SOURCE_TTL_SECONDS: ${REVIEW_SOURCE_TTL_SECONDS}

      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS}
      QUEUE_REMOVE_ON_COMPLETE: ${QUEUE_REMOVE_ON_COMPLETE}
      QUEUE_REMOVE_ON_FAIL: ${QUEUE_REMOVE_ON_FAIL}

      REVIEW_QUEUE_NAME: ${REVIEW_QUEUE_NAME}
      REPORT_QUEUE_NAME: ${REPORT_QUEUE_NAME}
      CLEANUP_QUEUE_NAME: ${CLEANUP_QUEUE_NAME}
      NOTIFICATION_QUEUE_NAME: ${NOTIFICATION_QUEUE_NAME}

      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT}

      AI_ENABLED: ${AI_ENABLED}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}
      AI_MAX_FINDINGS: ${AI_MAX_FINDINGS}
      AI_MAX_SOURCE_BYTES: ${AI_MAX_SOURCE_BYTES}
      AI_MAX_CONTEXT_BYTES: ${AI_MAX_CONTEXT_BYTES}
      AI_TEMPERATURE: ${AI_TEMPERATURE}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      CLOUDINARY_SECURE: ${CLOUDINARY_SECURE}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES}
      MAX_FILES_PER_SOURCE: ${MAX_FILES_PER_SOURCE}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES}
      MAX_SOURCE_PATH_LENGTH: ${MAX_SOURCE_PATH_LENGTH}
      MAX_PROJECT_NAME_LENGTH: ${MAX_PROJECT_NAME_LENGTH}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      SCHEDULER_MIN_INTERVAL_SECONDS: ${SCHEDULER_MIN_INTERVAL_SECONDS}

      # Chapa payment configuration
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      PRO_PLAN_PRICE: ${PRO_PLAN_PRICE}
      ENTERPRISE_PLAN_PRICE: ${ENTERPRISE_PLAN_PRICE}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY}

    ports:
      - "5000:5000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["node", "worker.js"]

    dns:
      - ${DOCKER_DNS_PRIMARY:-1.1.1.1}
      - ${DOCKER_DNS_SECONDARY:-8.8.8.8}

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      HOST: ${HOST}

      USER_TIER: ${USER_TIER}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ReviewX}
      SMTP_REPLY_TO_EMAIL: ${SMTP_REPLY_TO_EMAIL:-}

      MONGODB_URI: ${MONGODB_URI}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE}
      MONGODB_AUTO_INDEX: ${MONGODB_AUTO_INDEX}

      REDIS_URL: redis://redis:6379
      REVIEW_SOURCE_REDIS_PREFIX: ${REVIEW_SOURCE_REDIS_PREFIX}
      REVIEW_SOURCE_TTL_SECONDS: ${REVIEW_SOURCE_TTL_SECONDS}

      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS}
      QUEUE_REMOVE_ON_COMPLETE: ${QUEUE_REMOVE_ON_COMPLETE}
      QUEUE_REMOVE_ON_FAIL: ${QUEUE_REMOVE_ON_FAIL}

      REVIEW_QUEUE_NAME: ${REVIEW_QUEUE_NAME}
      REPORT_QUEUE_NAME: ${REPORT_QUEUE_NAME}
      CLEANUP_QUEUE_NAME: ${CLEANUP_QUEUE_NAME}
      NOTIFICATION_QUEUE_NAME: ${NOTIFICATION_QUEUE_NAME}

      AI_ENABLED: ${AI_ENABLED}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}
      AI_MAX_FINDINGS: ${AI_MAX_FINDINGS}
      AI_MAX_SOURCE_BYTES: ${AI_MAX_SOURCE_BYTES}
      AI_MAX_CONTEXT_BYTES: ${AI_MAX_CONTEXT_BYTES}
      AI_TEMPERATURE: ${AI_TEMPERATURE}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      CLOUDINARY_SECURE: ${CLOUDINARY_SECURE}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES}
      MAX_FILES_PER_SOURCE: ${MAX_FILES_PER_SOURCE}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES}
      MAX_SOURCE_PATH_LENGTH: ${MAX_SOURCE_PATH_LENGTH}
      MAX_PROJECT_NAME_LENGTH: ${MAX_PROJECT_NAME_LENGTH}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      SCHEDULER_MIN_INTERVAL_SECONDS: ${SCHEDULER_MIN_INTERVAL_SECONDS}

      # Chapa payment configuration
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      PRO_PLAN_PRICE: ${PRO_PLAN_PRICE}
      ENTERPRISE_PLAN_PRICE: ${ENTERPRISE_PLAN_PRICE}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY}

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

    volumes:
      - redis_data:/data

volumes:
  redis_data: